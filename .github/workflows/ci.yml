name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --locked
      - run: python3 scripts/check_stream_pty.py --binary target/debug/gezi
      - run: python3 scripts/test_stream_pty.py --binary target/debug/gezi
      - run: python3 -B scripts/test_reader_pty.py --binary target/debug/gezi
      - run: python3 -B scripts/test_images_pty.py --binary target/debug/gezi
      - run: python3 -B -m unittest discover -s scripts -p 'test_*release.py'
      - name: Build and verify Apple Silicon package
        run: |
          test "$(uname -m)" = arm64
          cargo build --release --locked --target aarch64-apple-darwin
          python3 -B scripts/package_release.py --binary target/aarch64-apple-darwin/release/gezi --out-dir "${{ runner.temp }}/gezi-release-package"
          python3 -B scripts/check_package.py --package-dir "${{ runner.temp }}/gezi-release-package"
      - name: Preserve checked macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gezi-macos-arm64
          path: ${{ runner.temp }}/gezi-release-package/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish version
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: gezi-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gezi-macos-arm64
          path: target/release-assets
      - run: python3 scripts/release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
