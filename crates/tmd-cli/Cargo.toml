[package]
name = "tmd-cli"
default-run = "gezi"
description = "Gezi: a Kaku-first terminal Markdown editor with reading and rendering available today"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gezi"
path = "src/main.rs"

[[bin]]
name = "ge"
path = "src/ge.rs"
test = false
bench = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3"
serde_json = "1"
terminal-colorsaurus = "1"
toml = "1"
tmd-core = { path = "../tmd-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
ureq = { version = "3", features = ["socks-proxy"] }
base64 = "0.22"
xmlparser = "0.13"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term"] }
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
arboard = { version = "3.7", default-features = false }

[dev-dependencies]
insta = "1.49"
